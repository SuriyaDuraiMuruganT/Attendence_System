version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: always
    environment:
      POSTGRES_USER: attendance_admin
      POSTGRES_PASSWORD: StrongAttendancePostgresPassword2026
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_admin -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://attendance_admin:StrongAttendancePostgresPassword2026@db:5432/attendance_db
      JWT_SECRET_KEY: production-jwt-secret-key-super-secure-change-this
      APPROVED_OFFICE_IPS: "127.0.0.1,::1,192.168.0.0/16,10.0.0.0/8"
      ENFORCE_OFFICE_NETWORK: "true"
      TIMEZONE: "Asia/Kolkata"
      PORT: "8000"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: attendance_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:

