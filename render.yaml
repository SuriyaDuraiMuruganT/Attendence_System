services:
  - type: web
    name: attendance-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENFORCE_OFFICE_NETWORK
        value: "true"
      - key: APPROVED_OFFICE_IPS
        value: "103.21.244.0/22,122.161.45.22"

databases:
  - name: attendance-db
    databaseName: attendance_prod
    user: attendance_user
    plan: free

