services:
  - type: web
    name: attendance-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENFORCE_OFFICE_NETWORK
        value: "true"
      - key: APPROVED_OFFICE_IPS
        value: "49.37.201.144,49.37.201.0/24,2405:201:e029:f00c:2dc9:10f8:e8d0:dff9,2405:201:e029:f00c::/64"


